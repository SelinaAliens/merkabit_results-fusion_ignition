kcp_version: '0.14'
project: merkabit-results-fusion-ignition
description: >
  Paper 3 of the Merkabit series. Covers IBM quantum verification and fusion ignition physics using the PSL(2,7) algebraic
  geometry framework. The manuscript derives universal confinement ratios, Lawson criterion gap analysis, and breathing window
  (F-gate) ignition dynamics. No README exists — the PDF manuscript is the primary orientation unit.
version: '1.0'
created: '2026-04-06'
maintainer: Selina Stenberg
